<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация</title>
<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/fontawesome.min.css">
<link rel="stylesheet" href="css/solid.min.css">
<link rel="stylesheet" href="theme.css">
</head><body style="background:#fff;padding:12px;display:inline-block">
<div class="phone" id="shot"><div class="status-bar"><span>9:41</span><span><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div><div class="appbar"><i class="fa-solid fa-arrow-left"></i>Регистрация</div><div class="screen">
<div class="d-flex flex-column align-items-center text-center mb-3">
  <div class="round-icon mb-2"><i class="fa-solid fa-seedling"></i></div>
  <h5 class="fw-bold mb-1">Создайте аккаунт</h5>
  <div class="text-muted small">Записывайтесь на посадки и следите за деревьями</div>
</div>
<div class="form-floating mb-2"><input type="email" class="form-control" id="e" value="anna@example.com" placeholder="Эл. почта"><label for="e">Электронная почта</label></div>
<div class="form-floating mb-2"><input type="password" class="form-control" id="p" value="password1" placeholder="Пароль"><label for="p">Пароль</label></div>
<div class="form-floating mb-3"><input type="password" class="form-control" id="p2" value="password1" placeholder="Повтор"><label for="p2">Повторите пароль</label></div>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="c" checked><label class="form-check-label small" for="c">Я согласен с правилами фонда</label></div>
<button class="btn btn-primary btn-lg w-100 mb-3">Зарегистрироваться</button>
<div class="text-center small">Уже есть аккаунт? <a href="#" class="fw-semibold">Войти</a></div>
</div></div>
</body></html>
