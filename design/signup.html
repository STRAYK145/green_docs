<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запись на акцию</title>
<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/fontawesome.min.css">
<link rel="stylesheet" href="css/solid.min.css">
<link rel="stylesheet" href="theme.css">
</head><body style="background:#fff;padding:12px;display:inline-block">
<div class="phone" id="shot"><div class="status-bar"><span>9:41</span><span><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div><div class="appbar"><i class="fa-solid fa-arrow-left"></i>Запись на акцию</div><div class="screen">
<div class="card mb-3 overflow-hidden">
  <div class="photo" style="height:90px"><i class="fa-solid fa-seedling"></i></div>
  <div class="card-body">
    <h6 class="fw-bold mb-2">Посадка в Парке Победы</h6>
    <div class="small mb-1"><i class="fa-solid fa-calendar-days text-primary me-2"></i>18 апреля, 10:00</div>
    <div class="small mb-1"><i class="fa-solid fa-location-dot text-primary me-2"></i>Центральный район, вход с ул. Садовой</div>
    <div class="small mb-3"><i class="fa-solid fa-tree text-primary me-2"></i>40 деревьев: липа, клён, рябина</div>
    <div class="progress mb-1" style="height:8px"><div class="progress-bar" style="width:60%"></div></div>
    <div class="small text-muted"><i class="fa-solid fa-users me-1"></i>24 из 40 участников</div>
  </div>
</div>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="g" checked><label class="form-check-label small" for="g">Возьму свои перчатки</label></div>
<button class="btn btn-primary btn-lg w-100 mb-2">Записаться</button>
<button class="btn btn-outline-primary w-100">Отменить участие</button>
</div></div>
</body></html>
