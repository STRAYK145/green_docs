<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Документация приложения «Зелёный город»</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* скриншоты экранов не растягиваем на весь сайт */
    .markdown-section img { max-height: 520px; width: auto; max-width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>
  <script>
    window.$docsify = {
      name: 'Зелёный город',
      relativePath: true,
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      // одно боковое меню (из корня) на всех страницах
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
